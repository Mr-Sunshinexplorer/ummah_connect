name: ummah_connect
description: A Khilafat app uniting Muslims worldwide
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  
  # Features
  geolocator: ^10.1.0
  adhan: ^2.0.0+1
  audioplayers: ^5.2.1
  connectivity_plus: ^5.0.2
  vibration: ^3.1.3

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  http: ^1.1.0
  
  # P2P Chat
  flutter_webrtc: ^0.12.5+hotfix.1  # Updated version
  web_socket_channel: ^2.4.0
  
  # File Storage
  path_provider: ^2.1.1
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Remove these if folders are empty:
  # assets:
  #   - assets/images/
  #   - assets/animations/